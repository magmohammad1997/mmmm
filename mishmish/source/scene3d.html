function hideClouds(){world.clouds.forEach(c=>c.visible=false)}
function smokeOff(){world.smoke.forEach(s=>s.visible=false)}
function look(px,py,pz,tx,ty,tz){cam.position.set(px,py,pz);cam.lookAt(tx,ty,tz)}
function skyCols(a,b){skyMat.uniforms.top.value.set(a);skyMat.uniforms.bot.value.set(b)}

function render3D(t){
 const mo=mouthAt(t),p=pulse(t);
 world.miniCat.visible=false;smokeOff();world.flame.visible=false;
 world.stars.forEach(s=>s.visible=false);
 if(t<4){ // intro
  setVis({roof:false,ground:false,rocket:false,cat:t>1.6,moon:true});hideClouds();skyCols('#05031f','#3b1b6e');starPts.visible=true;
  const k=ease(clamp(t/4));world.moon.position.set(0,lerp(-1,5.2,k),-10);world.moon.scale.setScalar(lerp(1.6,2.4,k));updateMoon(world.moon,t,{happy:t>2});
  const k2=back((t-1.6)/.45);world.cat.position.set(0,lerp(-4.5,-1.2,k2),1);world.cat.rotation.set(0,0,0);
  updateCat(world.cat,t,{mouth:mo,lookY:1,headX:-.25,armsUp:.45,squash:p*.4});
  look(0,1.8,9,0,2.4,0);
 }else if(t<20){ // roof
  const T=t-4;setVis({roof:true,ground:false,rocket:false,cat:true,moon:true});hideClouds();skyCols('#0b0838','#5b2a86');
  world.moon.position.set(1.5,8.0+Math.sin(t*.8)*.15,-14);world.moon.scale.setScalar(2.6);updateMoon(world.moon,t,{wink:T>7.5&&T<8.6,happy:T>12});
  const walk=clamp(T/2.2);const hop=walk<1?Math.abs(Math.sin(T*9))*.22:0;const jump=T>13.3?Math.max(0,Math.sin((T-13.3)*Math.PI/1.1))*1.1:0;
  world.cat.position.set(lerp(-4.5,0,ease(walk)),hop+jump,0);world.cat.rotation.set(0,walk<1?Math.PI/2*.8:lerp(.8,.15,clamp((T-2.2)/.6))*(T<2.8?1:1)-0+ (walk<1?0:-.15),0);
  if(walk>=1)world.cat.rotation.y=lerp(Math.PI/2*.8,.15,clamp((T-2.2)/.6));
  updateCat(world.cat,t,{mouth:mo,lookX:.6,lookY:.8,headX:-.28,headY:.25,squash:p*.6,armsUp:T>13.3?.6:(T>6&&T<8?.25:0),wave:T>6&&T<8});
  const orb=Math.sin(T*.25)*.3;look(Math.sin(orb)*8.6,1.9,Math.cos(orb)*8.6,0,2.2,0);
 }else if(t<36){ // flying
  const T=t-20;setVis({roof:false,ground:false,rocket:false,cat:true,moon:true});skyCols('#123a8f','#7fc2ff');placeClouds(T,3.2);
  world.moon.position.set(Math.sin(t*.5)*.8,lerp(8,7,clamp(T/16)),lerp(-26,-14,clamp(T/16)));world.moon.scale.setScalar(lerp(2,3,clamp(T/16)));updateMoon(world.moon,t,{happy:true});
  const bob=Math.sin(t*Math.PI*2/(BEAT*2))*.18;world.cat.position.set(Math.sin(t*1.3)*1.1,1+bob,0);world.cat.rotation.set(-.15,Math.sin(t*.9)*.35,Math.sin(t*1.3)*-.15);
  updateCat(world.cat,t,{mouth:mo,armsUp:1,cape:true,lookY:1,headX:-.15,squash:p*.5});
  world.stars.forEach((s,i)=>{s.visible=true;const a=t*.9+i*1.2566;s.position.set(world.cat.position.x+Math.cos(a)*2.1,2.4+Math.sin(a)*.7,Math.sin(a)*1.6);s.scale.setScalar(.28+p*.06);s.rotation.set(0,Math.sin(t*2+i)*.5,t+i)});
  look(Math.sin(T*.2)*2.2,1.2,7.5,world.cat.position.x*.5,2.4,0);
 }else if(t<44){ // rocket
  const T=t-36;setVis({roof:true,ground:false,rocket:true,cat:T<2.2,moon:T>5.3});hideClouds();skyCols('#0b0838','#3c2a8a');
  const lift=T>4?Math.pow(T-4,2)*1.4:0;const shake=T>3&&T<4.6?Math.sin(t*90)*.04:0;
  world.rocket.position.set(.4+shake,lift,-.5);world.rocket.scale.setScalar(T<2.2?back(T/.6):1);world.rocket.rotation.y=-.35;
  if(T<2.2){world.cat.position.set(2.5,Math.abs(Math.sin(T*10))*.15,.6);world.cat.rotation.set(0,-.5,0);updateCat(world.cat,t,{mouth:mo,wave:true,armsUp:.4,lookX:-1,headY:-.2,s:.8})}
  else{world.miniCat.visible=true;world.rocket.updateMatrixWorld();const wp=new THREE.Vector3(0,1.66,.95).applyMatrix4(world.rocket.matrixWorld);world.miniCat.position.copy(wp);world.miniCat.rotation.y=-.35;updateCat(world.miniCat,t,{mouth:mo,s:.22,lookY:1,armsUp:.8})}
  if(T>3){world.flame.visible=true;const k=clamp((T-3)/.5);world.flame.scale.set(k*(1+.15*Math.sin(t*50)),k*(1+.25*Math.sin(t*37)),k)}
  if(T>3)world.smoke.forEach((s,i)=>{s.visible=true;const ph=((T-3)*1.3+rnd(i))%1;s.position.set(.4+(rnd(i*3)-.5)*6*ph,Math.max(.3,lift*.2)+ph*.8,-.5+(rnd(i*5)-.5)*3*ph);s.scale.setScalar(.3+ph*1.3);s.material.opacity=(1-ph)*.8});
  if(T>5.3){const k=ease(clamp((T-5.3)/2.4));world.moon.position.set(.4,lift+lerp(16,7,k),-4);world.moon.scale.setScalar(3.2);updateMoon(world.moon,t,{happy:true})}
  const cy=2.2+Math.max(0,lift-1)*.9;look(0,cy-(T>4?.5:0),9.5,0,cy+.6+(T>4?Math.min(2.5,(T-4)):0),0);
 }else{ // on the moon
  const T=t-44;setVis({roof:false,ground:true,rocket:false,cat:true,moon:false});hideClouds();skyCols('#1a0b4a','#7a3cb0');
  const final=T>12.5;const hop=final?0:Math.abs(Math.sin(t*Math.PI/BEAT))*.35;
  world.cat.position.set(0,hop,0);world.cat.rotation.set(0,Math.sin(t*Math.PI/(BEAT*4))*.35*(final?0:1),0);
  updateCat(world.cat,t,{mouth:mo,armsUp:final?.05:(Math.sin(t*Math.PI/(BEAT*2))>0?1:.35),holdStar:final,happyEyes:final&&mo<.1,squash:p*.6,tilt:Math.sin(t*Math.PI/BEAT)*.12,lookY:.3});
  world.stars.forEach((s,i)=>{s.visible=true;const a=i/5*6.283+t*1.1;s.position.set(Math.cos(a)*3.1,3.7+Math.sin(a*2)*.3-p*.15,Math.sin(a)*1.6-1.4);s.scale.setScalar(.42+p*.05);s.rotation.set(0,-a+Math.PI/2+Math.sin(t*3)*.3,Math.sin(t*3+i)*.3)});
  const z=lerp(8.5,6.8,clamp(T/16));look(Math.sin(T*.3)*1.5,1.9,z,0,1.8,0);
 }
 moonLight.position.copy(world.moon.position).add(new THREE.Vector3(0,0,3));moonLight.visible=world.moon.visible;
 key.target.position.copy(world.cat.position);key.position.copy(world.cat.position).add(new THREE.Vector3(5,9,7));
 starPts.rotation.y=t*.01;starPts.material.opacity=(t>=20&&t<36)?.25:1;
 renderer.render(scene,cam);
}
// ---------- 2D overlay ----------
function star2(x,y,r,fill,rot=0,pts=5,inner=.45){g.beginPath();for(let i=0;i<pts*2;i++){const a=rot+i*Math.PI/pts-Math.PI/2,rr=i%2?r*inner:r;g.lineTo(x+Math.cos(a)*rr,y+Math.sin(a)*rr)}g.closePath();g.fillStyle=fill;g.fill()}
function outlined(txt,x,y,size,fill,stroke='#2a1450',lw=14){g.font=`${size}px Lz`;g.textAlign='center';g.direction='rtl';g.lineJoin='round';g.strokeStyle=stroke;g.lineWidth=lw;g.strokeText(txt,x,y);g.fillStyle=fill;g.fillText(txt,x,y)}
function lyrics(t){
 if(!TIMING)return;const L=TIMING.lines.find(l=>t>=l.start-.45&&t<=l.end+.55);if(!L)return;
 const inK=clamp((t-(L.start-.45))/.25),outK=clamp((L.end+.55-t)/.25);const a=Math.min(inK,outK);
 let size=86;g.font=`${size}px Lz`;let w=g.measureText(L.text).width;if(w>960){size=size*960/w;g.font=`${size}px Lz`;w=g.measureText(L.text).width}
 const x=W/2,y=1560+(1-back(inK))*60;g.globalAlpha=a;
 g.fillStyle='rgba(30,10,70,.5)';const pw=w+90,ph=size*1.55;g.beginPath();g.roundRect(x-pw/2,y-size*1.05,pw,ph,40);g.fill();
 outlined(L.text,x,y,size,'#ffffff');
 const n=L.syl.length;let done=0;for(const [a0,b0] of L.syl){if(t>=b0)done++;else if(t>a0){done+=(t-a0)/(b0-a0);break}else break}
 const pp=done/n;g.save();g.beginPath();g.rect(x+w/2+10-pp*(w+20),y-size*1.3,pp*(w+20),size*2);g.clip();outlined(L.text,x,y,size,'#ffd23f','#7a1f2b');g.restore();g.globalAlpha=1}
function overlay(t){
 const gr=g.createRadialGradient(W/2,H/2,H*.38,W/2,H/2,H*.78);gr.addColorStop(0,'rgba(0,0,0,0)');gr.addColorStop(1,'rgba(10,0,30,.4)');g.fillStyle=gr;g.fillRect(0,0,W,H);
 if(t<4.2){const k=back(clamp(t/.8));g.save();g.globalAlpha=clamp((4.2-t)/.3);g.translate(W/2,300);g.scale(k*(1+.04*pulse(t)),k);g.rotate(Math.sin(t*2)*.03);
  outlined('مشمش',0,0,190,'#ffb43b','#4a1a5e',26);outlined('والقمر',0,150,130,'#fff3a8','#4a1a5e',22);star2(-300,-60,34,'#ffe14d',t);star2(300,90,26,'#ffe14d',-t);g.restore()}
 if(t>=4)lyrics(t);
 const T=t-44;if(T>12.5){const k=back(clamp((T-12.5)/.7));g.save();g.translate(W/2,300);g.scale(k,k);outlined('النهاية 💛',0,0,150,'#ffd23f','#4a1a5e',24);g.restore();
  g.globalAlpha=clamp((T-13.6)/.5);outlined('شاركوا الأغنية مع أحبابكم ✨',W/2,440,64,'#ffffff','#4a1a5e',14);g.globalAlpha=1}
 for(const T0 of [4,20,36,44]){const d=Math.abs(t-T0);if(d<.3){g.fillStyle=`rgba(255,255,255,${(1-d/.3)*.8})`;g.fillRect(0,0,W,H)}}
 if(t<.4){g.fillStyle=`rgba(0,0,0,${1-t/.4})`;g.fillRect(0,0,W,H)}
 if(t>59.2){g.fillStyle=`rgba(0,0,0,${(t-59.2)/.8})`;g.fillRect(0,0,W,H)}
}
window.render=t=>{render3D(t);g.imageSmoothingQuality='high';g.drawImage(glc,0,0,W,H);overlay(t)};
window.setData=(tm,mouth)=>{TIMING=tm;MOUTH=mouth};
window.ready=true;
</script></body></html>
