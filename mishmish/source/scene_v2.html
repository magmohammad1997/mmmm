function overlay(t){
 const gr=g.createRadialGradient(W/2,H/2,H*.38,W/2,H/2,H*.78);gr.addColorStop(0,'rgba(0,0,0,0)');gr.addColorStop(1,'rgba(10,0,30,.4)');g.fillStyle=gr;g.fillRect(0,0,W,H);
 if(t<S.v1+.2){const k=back(clamp(t/.8));g.save();g.globalAlpha=clamp((S.v1+.2-t)/.3);g.translate(W/2,300);g.scale(k*(1+.04*pulse(t)),k);g.rotate(Math.sin(t*2)*.03);
  outlined('مشمش',0,0,190,'#ffb43b','#4a1a5e',26);outlined('والقمر',0,150,130,'#fff3a8','#4a1a5e',22);star2(-300,-60,34,'#ffe14d',t);star2(300,90,26,'#ffe14d',-t);g.restore()}
 if(t>=S.v1-.6)lyrics(t);
 const T=t-(S.end-3.6);if(T>0){const k=back(clamp(T/.7));g.save();g.translate(W/2,300);g.scale(k,k);outlined('النهاية 💛',0,0,150,'#ffd23f','#4a1a5e',24);g.restore();
  g.globalAlpha=clamp((T-1.1)/.5);outlined('شاركوا الأغنية مع أحبابكم ✨',W/2,440,64,'#ffffff','#4a1a5e',14);g.globalAlpha=1}
 for(const T0 of [S.v1,S.ch1,S.v2,S.ch2]){const d=Math.abs(t-T0);if(d<.3){g.fillStyle=`rgba(255,255,255,${(1-d/.3)*.8})`;g.fillRect(0,0,W,H)}}
 if(t<.4){g.fillStyle=`rgba(0,0,0,${1-t/.4})`;g.fillRect(0,0,W,H)}
 if(t>S.end-.8){g.fillStyle=`rgba(0,0,0,${clamp((t-S.end+.8)/.8)})`;g.fillRect(0,0,W,H)}
}
